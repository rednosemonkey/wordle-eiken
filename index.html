<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eiken Wordle</title>
<style>
/* ===== CSS Variables / Theme ===== */
:root {
  --color-tone-1: #1a1a1b;
  --color-tone-2: #787c7e;
  --color-tone-3: #878a8c;
  --color-tone-4: #d3d6da;
  --color-tone-5: #edeff1;
  --color-tone-6: #f6f7f8;
  --color-tone-7: #ffffff;
  --color-correct: #6aaa64;
  --color-present: #c9b458;
  --color-absent: #787c7e;
  --key-bg: #d3d6da;
  --key-text: #1a1a1b;
  --header-height: 50px;
  --keyboard-height: 200px;
  --game-max-width: 500px;
}

.dark {
  --color-tone-1: #d7dadc;
  --color-tone-2: #818384;
  --color-tone-3: #565758;
  --color-tone-4: #3a3a3c;
  --color-tone-5: #272729;
  --color-tone-6: #1a1a1b;
  --color-tone-7: #121213;
  --color-correct: #538d4e;
  --color-present: #b59f3b;
  --color-absent: #3a3a3c;
  --key-bg: #818384;
  --key-text: #d7dadc;
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
  background-color: var(--color-tone-7);
  color: var(--color-tone-1);
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  transition: background-color 0.3s, color 0.3s;
}

/* ===== Header ===== */
header {
  width: 100%;
  max-width: var(--game-max-width);
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--color-tone-4);
  position: relative;
  flex-shrink: 0;
}

header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.1rem;
  text-transform: uppercase;
}

.header-icons {
  position: absolute;
  right: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--color-tone-1);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.3s;
}

.icon-btn svg {
  width: 24px;
  height: 24px;
}

/* ===== Toast ===== */
#toast-container {
  position: fixed;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background-color: var(--color-tone-1);
  color: var(--color-tone-7);
  padding: 12px 24px;
  border-radius: 4px;
  font-size: 0.875rem;
  font-weight: 700;
  opacity: 1;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.toast.fade-out {
  opacity: 0;
}

/* ===== Game Board ===== */
#board-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: var(--game-max-width);
  padding: 10px;
  overflow: hidden;
}

#board {
  display: grid;
  grid-template-rows: repeat(6, 1fr);
  gap: 5px;
  width: min(350px, 100%);
  aspect-ratio: 5/6;
  max-height: 100%;
}

.row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.tile {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.5rem, 6vw, 2rem);
  font-weight: 700;
  text-transform: uppercase;
  border: 2px solid var(--color-tone-4);
  color: var(--color-tone-1);
  user-select: none;
  aspect-ratio: 1;
  transition: border-color 0.1s;
}

.tile[data-state="tbd"] {
  border-color: var(--color-tone-3);
}

.tile[data-state="correct"] {
  background-color: var(--color-correct);
  border-color: var(--color-correct);
  color: #ffffff;
}

.tile[data-state="present"] {
  background-color: var(--color-present);
  border-color: var(--color-present);
  color: #ffffff;
}

.tile[data-state="absent"] {
  background-color: var(--color-absent);
  border-color: var(--color-absent);
  color: #ffffff;
}

/* ===== Tile Animations ===== */
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes flipIn {
  0% { transform: rotateX(0); }
  100% { transform: rotateX(-90deg); }
}

@keyframes flipOut {
  0% { transform: rotateX(-90deg); }
  100% { transform: rotateX(0); }
}

@keyframes bounce {
  0%, 20% { transform: translateY(0); }
  40% { transform: translateY(-30px); }
  50% { transform: translateY(5px); }
  60% { transform: translateY(-15px); }
  80% { transform: translateY(2px); }
  100% { transform: translateY(0); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
  20%, 40%, 60%, 80% { transform: translateX(4px); }
}

.tile.pop {
  animation: pop 100ms ease-in-out;
}

.tile.flip-in {
  animation: flipIn 250ms ease-in forwards;
}

.tile.flip-out {
  animation: flipOut 250ms ease-out forwards;
}

.row.shake {
  animation: shake 600ms ease;
}

.tile.bounce {
  animation: bounce 1000ms ease;
}

/* ===== Keyboard ===== */
#keyboard {
  width: 100%;
  max-width: var(--game-max-width);
  padding: 0 8px 8px;
  flex-shrink: 0;
}

.kb-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 6px;
}

.kb-row:last-child {
  margin-bottom: 0;
}

.key {
  height: 58px;
  min-width: 0;
  flex: 1;
  max-width: 43px;
  border: none;
  border-radius: 4px;
  background-color: var(--key-bg);
  color: var(--key-text);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color 0.3s, color 0.3s;
}

.key.wide {
  flex: 1.5;
  max-width: 65px;
  font-size: 0.75rem;
}

.key[data-state="correct"] {
  background-color: var(--color-correct);
  color: #ffffff;
}

.key[data-state="present"] {
  background-color: var(--color-present);
  color: #ffffff;
}

.key[data-state="absent"] {
  background-color: var(--color-absent);
  color: #ffffff;
}

.key:active {
  opacity: 0.8;
}

/* ===== New Game Button ===== */
#new-game-btn {
  display: none;
  margin: 0 auto;
  padding: 12px 32px;
  background-color: var(--color-correct);
  color: #ffffff;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

#new-game-btn:active {
  opacity: 0.8;
}

#new-game-footer {
  width: 100%;
  max-width: var(--game-max-width);
  padding: 0 8px 8px;
  text-align: center;
  flex-shrink: 0;
}
</style>
</head>

// Combine both lists into a Set for fast lookup
const ALL_VALID = new Set([...ANSWERS, ...VALID_GUESSES]);

// ===== GAME STATE =====
let targetWord = '';
let currentRow = 0;
let currentCol = 0;
let currentGuess = [];
let gameOver = false;
let boardState = []; // 6 rows of 5 tiles

// ===== DOM REFS =====
const boardEl = document.getElementById('board');
const toastContainer = document.getElementById('toast-container');
const newGameBtn = document.getElementById('new-game-btn');
const themeToggle = document.getElementById('theme-toggle');
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');

// ===== INIT =====
function init() {
  // Build the board
  boardEl.innerHTML = '';
  boardState = [];
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.classList.add('row');
    row.dataset.row = r;
    const tiles = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.classList.add('tile');
      tile.dataset.row = r;
      tile.dataset.col = c;
      row.appendChild(tile);
      tiles.push(tile);
    }
    boardEl.appendChild(row);
    boardState.push(tiles);
  }

  // Reset state
  currentRow = 0;
  currentCol = 0;
  currentGuess = [];
  gameOver = false;
  newGameBtn.style.display = 'none';

  // Reset keyboard colors
  document.querySelectorAll('.key').forEach(key => {
    key.removeAttribute('data-state');
  });

  // Pick a random word
  targetWord = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
}

// ===== THEME =====
function initTheme() {
  const saved = localStorage.getItem('eiken-wordle-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark');
    iconSun.style.display = 'none';
    iconMoon.style.display = 'block';
  }
}

themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  iconSun.style.display = isDark ? 'none' : 'block';
  iconMoon.style.display = isDark ? 'block' : 'none';
  localStorage.setItem('eiken-wordle-theme', isDark ? 'dark' : 'light');
});

// ===== TOAST =====
function showToast(message, duration = 1500) {
  const toast = document.createElement('div');
  toast.classList.add('toast');
  toast.textContent = message;
  toastContainer.prepend(toast);
  if (duration > 0) {
    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }
  return toast;
}

// ===== INPUT HANDLING =====
function addLetter(letter) {
  if (gameOver || currentCol >= 5) return;
  const tile = boardState[currentRow][currentCol];
  tile.textContent = letter;
  tile.dataset.state = 'tbd';
  tile.classList.remove('pop');
  // Force reflow to restart animation
  void tile.offsetWidth;
  tile.classList.add('pop');
  currentGuess.push(letter);
  currentCol++;
}

function removeLetter() {
  if (gameOver || currentCol <= 0) return;
  currentCol--;
  const tile = boardState[currentRow][currentCol];
  tile.textContent = '';
  tile.removeAttribute('data-state');
  currentGuess.pop();
}

function submitGuess() {
  if (gameOver) return;
  if (currentCol < 5) {
    shakeRow(currentRow);
    showToast('Not enough letters');
    return;
  }

  const guess = currentGuess.join('');

  if (!ALL_VALID.has(guess)) {
    shakeRow(currentRow);
    showToast('Not in word list');
    return;
  }

  const evaluation = evaluateGuess(guess);
  revealRow(currentRow, evaluation, guess);
}

// ===== GUESS EVALUATION =====
function evaluateGuess(guess) {
  const result = Array(5).fill('absent');
  const targetLetters = targetWord.split('');
  const guessLetters = guess.split('');

  // First pass: correct positions (green)
  for (let i = 0; i < 5; i++) {
    if (guessLetters[i] === targetLetters[i]) {
      result[i] = 'correct';
      targetLetters[i] = null;
      guessLetters[i] = null;
    }
  }

  // Second pass: present but wrong position (yellow)
  for (let i = 0; i < 5; i++) {
    if (guessLetters[i] === null) continue;
    const idx = targetLetters.indexOf(guessLetters[i]);
    if (idx !== -1) {
      result[i] = 'present';
      targetLetters[idx] = null;
    }
  }

  return result;
}

// ===== ANIMATIONS =====
function shakeRow(rowIdx) {
  const row = boardEl.querySelector(`.row[data-row="${rowIdx}"]`);
  row.classList.remove('shake');
  void row.offsetWidth;
  row.classList.add('shake');
  row.addEventListener('animationend', () => row.classList.remove('shake'), { once: true });
}

function revealRow(rowIdx, evaluation, guess) {
  const tiles = boardState[rowIdx];
  let delay = 0;
  const FLIP_DURATION = 250;
  const STAGGER = 300;

  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('flip-in');
      tile.addEventListener('animationend', function handler() {
        tile.classList.remove('flip-in');
        tile.dataset.state = evaluation[i];
        tile.classList.add('flip-out');
        tile.addEventListener('animationend', function handler2() {
          tile.classList.remove('flip-out');
          // Update keyboard on last tile
          if (i === 4) {
            updateKeyboard(guess, evaluation);
            checkGameEnd(evaluation, rowIdx);
          }
        }, { once: true });
      }, { once: true });
    }, delay);
    delay += STAGGER;
  });
}

function bounceRow(rowIdx) {
  const tiles = boardState[rowIdx];
  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('bounce');
      tile.addEventListener('animationend', () => tile.classList.remove('bounce'), { once: true });
    }, i * 100);
  });
}

// ===== KEYBOARD UPDATE =====
function updateKeyboard(guess, evaluation) {
  const STATE_PRIORITY = { correct: 3, present: 2, absent: 1 };

  for (let i = 0; i < 5; i++) {
    const letter = guess[i];
    const state = evaluation[i];
    const key = document.querySelector(`.key[data-key="${letter}"]`);
    if (!key) continue;

    const currentState = key.dataset.state;
    const currentPriority = STATE_PRIORITY[currentState] || 0;
    const newPriority = STATE_PRIORITY[state] || 0;

    if (newPriority > currentPriority) {
      key.dataset.state = state;
    }
  }
}

// ===== GAME END =====
function checkGameEnd(evaluation, rowIdx) {
  const isWin = evaluation.every(s => s === 'correct');

  if (isWin) {
    gameOver = true;
    const messages = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
    setTimeout(() => {
      bounceRow(rowIdx);
      showToast(messages[rowIdx] || 'Nice!');
    }, 200);
    setTimeout(() => {
      newGameBtn.style.display = 'block';
    }, 1800);
  } else if (rowIdx === 5) {
    gameOver = true;
    setTimeout(() => {
      showToast(targetWord.toUpperCase(), 3000);
    }, 200);
    setTimeout(() => {
      newGameBtn.style.display = 'block';
    }, 2000);
  } else {
    currentRow++;
    currentCol = 0;
    currentGuess = [];
  }
}

// ===== EVENT LISTENERS =====
// On-screen keyboard
document.getElementById('keyboard').addEventListener('click', (e) => {
  const key = e.target.closest('.key');
  if (!key) return;
  const val = key.dataset.key;
  if (val === 'Enter') {
    submitGuess();
  } else if (val === 'Backspace') {
    removeLetter();
  } else {
    addLetter(val);
  }
});

// Physical keyboard (for testing on desktop)
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') {
    submitGuess();
  } else if (e.key === 'Backspace') {
    removeLetter();
  } else if (/^[a-zA-Z]$/.test(e.key)) {
    addLetter(e.key.toLowerCase());
  }
});

// New game button
newGameBtn.addEventListener('click', () => {
  init();
});

// Prevent zoom on double-tap
document.addEventListener('dblclick', (e) => {
  e.preventDefault();
});

// ===== START =====
initTheme();
init();
</script>
